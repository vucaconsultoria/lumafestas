<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo Luma Festas · Atacado e Atacarejo</title>
<meta name="description" content="Catálogo atacado e atacarejo Luma Festas — monte seu pedido e envie pelo WhatsApp.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --black:#000000; --black2:#141414; --pink:#E0197D; --pink-dark:#B80F63; --pink-soft:#FDE6F1;
  --gold:#C9A43A; --bg:#F5F5F5; --surface:#FFFFFF; --line:#E6E6E6; --ink:#1A1A1A; --muted:#6F6F6F;
  --ok:#0E8A4F; --warn:#A35A00; --err:#C62828;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 22px -16px rgba(0,0,0,.35); --r:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Poppins,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}

/* ===== topo preto ===== */
.site-head{position:sticky;top:0;z-index:30}
.bar-black{background:var(--black);color:#fff;border-top:3px solid var(--pink)}
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding-block:12px}
.logo{display:block;height:64px}
.logo img{height:100%;width:auto;display:block}
.logo .fallback{font:700 20px Poppins,sans-serif;color:var(--gold);letter-spacing:.02em}
.search{position:relative}
.search input{width:100%;padding:12px 44px 12px 16px;border-radius:4px;border:1px solid #3A3A3A;background:var(--black);color:#fff;font-size:14px}
.search input::placeholder{color:#9A9A9A}
.search input:focus{outline:2px solid var(--pink);outline-offset:0;border-color:transparent}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#fff}
.cartbtn{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;text-align:left;padding:4px}
.cartbtn .ic{width:40px;height:40px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;flex:0 0 40px}
.cartbtn .lbl{display:flex;flex-direction:column;line-height:1.2}
.cartbtn .lbl b{font-size:14px}
.cartbtn .lbl span{font-size:13px;color:#ddd;font-variant-numeric:tabular-nums}
/* ===== barra rosa (catálogos) ===== */
.bar-pink{background:var(--pink)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;justify-content:center}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:#fff;text-transform:uppercase;font-size:13.5px;font-weight:500;letter-spacing:.02em;padding:16px 16px 14px;white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{background:rgba(0,0,0,.08)}
.tab[aria-pressed=true]{border-bottom-color:#fff;font-weight:700}
/* ===== subgrupos ===== */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:14px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
.chip b{font-weight:600;opacity:.7;margin-left:5px;font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .top{grid-template-columns:auto 1fr;gap:12px}
  .logo{height:48px}
  .search{grid-column:1/-1;grid-row:2}
  .cartbtn{justify-self:end}
  .cartbtn .lbl{display:none}
  .tabs{justify-content:flex-start}
  .tab{padding:13px 12px 11px;font-size:12.5px}
}

/* ===== toolbar ===== */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 8px;font-size:12.5px;color:var(--muted)}
.toolbar strong{color:var(--ink);font-variant-numeric:tabular-nums}
.toolbar .grow{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:12.5px}
.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.switch input{accent-color:var(--pink);width:15px;height:15px}

/* ===== grade ===== */
main{padding-block:4px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:border-color .15s}
.card:hover{border-color:var(--pink)}
.thumb{position:relative;aspect-ratio:1/1;background:#FAFAFA;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.thumb .ph{font:700 28px Poppins,sans-serif;color:#C8C8C8}
.card.out .thumb{filter:grayscale(1) opacity(.6)}
.flag{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--pink);color:#fff}
.flag.o{background:#333}
.body{padding:10px 11px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.nm{font-size:12.5px;font-weight:600;line-height:1.3}
.cod{font-size:10.5px;color:var(--muted);letter-spacing:.03em}
.tiers{margin-top:auto;display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.tiers div{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.tiers b{font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.tiers .t2 b{color:var(--pink)}
.tiers .sc{font-style:italic}
.add{display:flex;gap:6px;margin-top:4px}
.add input{width:64px;min-width:0;flex:0 0 64px;border:1px solid var(--line);background:#FAFAFA;border-radius:6px;padding:7px 6px;text-align:center;font-variant-numeric:tabular-nums}
.add button{flex:1;border:0;border-radius:6px;background:var(--pink);color:#fff;font-weight:600;font-size:12.5px;padding:8px 6px}
.add button:hover{background:var(--pink-dark)}
.add button:disabled{background:#E0E0E0;color:#888;cursor:not-allowed}
.hint{font-size:10.5px;color:var(--muted);min-height:14px}
.hint.sc{color:var(--warn)}
.more{display:flex;justify-content:center;padding:18px}
.more button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 20px;font-weight:600}
.state{text-align:center;padding:60px 20px;color:var(--muted)}

/* ===== carrinho ===== */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;display:none;align-items:center;gap:8px;background:var(--black);color:#fff;border:0;border-radius:999px;padding:11px 16px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.fab.show{display:inline-flex}
.badge{min-width:20px;height:20px;border-radius:999px;background:var(--pink);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.open{display:block}
.drawer .bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--surface);display:flex;flex-direction:column}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--black);color:#fff;border-bottom:3px solid var(--pink)}
.panel-head h2{font-size:16px;margin:0;font-weight:600}
.x{border:0;background:transparent;font-size:24px;line-height:1;color:#fff;padding:2px 8px}
.scroll{flex:1;overflow:auto}
.items{padding:4px 16px}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.item .mini{width:52px;height:52px;border-radius:6px;background:#FAFAFA center/contain no-repeat;border:1px solid var(--line)}
.item .n{font-size:12.5px;font-weight:600;line-height:1.25}
.item .c{font-size:10.5px;color:var(--muted)}
.item .p{font-size:12px;color:var(--muted);margin-top:3px}
.item .p b{color:var(--ink)}
.item .p.sc{color:var(--warn)}
.item .warn{font-size:11px;color:var(--warn);margin-top:2px}
.item .q{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.item .q input{width:72px;border:1px solid var(--line);background:#FAFAFA;border-radius:6px;padding:6px;text-align:center;font-variant-numeric:tabular-nums}
.item .rm{border:0;background:none;color:var(--muted);font-size:11.5px;text-decoration:underline;padding:0}
.dados{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-top:8px solid var(--bg)}
.dados h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600}
.fld input{border:1px solid var(--line);background:#FAFAFA;border-radius:6px;padding:9px 11px;font-weight:400;font-size:14px}
.fld input:focus{outline:2px solid var(--pink);outline-offset:0;border-color:transparent}
.fld.err input{border-color:var(--err)}
.fld .msg{font-weight:400;font-size:11px;color:var(--err);min-height:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:9px;font-weight:600;cursor:pointer;background:#FAFAFA}
.seg input{accent-color:var(--pink)}
.seg label:has(input:checked){border-color:var(--pink);background:var(--pink-soft);color:var(--pink-dark)}
.foot{border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot b{font-size:18px;font-variant-numeric:tabular-nums}
.note{font-size:11.5px;color:var(--muted)}
.send{display:flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:6px;background:var(--ok);color:#fff;font-weight:700;padding:13px}
.send:disabled{opacity:.5;cursor:not-allowed}
.clear{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{background:var(--black);color:#bbb;font-size:12px}
footer .wrap{display:flex;gap:10px;flex-wrap:wrap;padding-block:18px 26px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="site-head">
  <div class="bar-black">
    <div class="wrap top">
      <a class="logo" href="./" aria-label="Luma Festas">
        <img id="logo" alt="Luma Festas" src="https://acdn-us.mitiendanube.com/stores/005/724/932/themes/common/logo-846732103-1737850977-b69d1277fb1b636db7bbaeaca8d0838a1737850977-320-0.webp">
      </a>
      <label class="search">
        <input id="q" type="search" placeholder="O que você está buscando?" autocomplete="off" aria-label="Buscar produtos">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </label>
      <button class="cartbtn" id="cartTop" type="button" aria-label="Abrir carrinho">
        <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 4h2l2.4 11h11l2-8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg></span>
        <span class="lbl"><b>Carrinho (<span id="badgeTop" style="color:#fff">0</span>)</b><span id="totTop">R$ 0,00</span></span>
      </button>
    </div>
  </div>
  <nav class="bar-pink" aria-label="Catálogos"><div class="wrap tabs" id="tabs"></div></nav>
</div>

<div class="wrap">
  <div class="chips" id="chips" hidden></div>
  <div class="toolbar">
    <span id="count"></span>
    <div class="grow">
      <label class="switch"><input type="checkbox" id="hideOut"> Ocultar esgotados</label>
      <label class="switch">Ordenar
        <select id="sort">
          <option value="nov">Novidades primeiro</option>
          <option value="cat">Catálogo</option>
          <option value="nome">Nome A–Z</option>
          <option value="asc">Menor preço</option>
          <option value="desc">Maior preço</option>
        </select>
      </label>
    </div>
  </div>
</div>

<main class="wrap">
  <div id="out"><p class="state">Carregando catálogo…</p></div>
  <div class="more" id="more" hidden><button type="button" id="moreBtn">Mostrar mais</button></div>
</main>

<footer><div class="wrap">
  <span>Preços por unidade, sujeitos a alteração. Abaixo da quantidade mínima: preço sob consulta.</span>
  <span id="upd" style="margin-left:auto"></span>
</div></footer>

<button class="fab" id="fab" type="button">Ver carrinho <span class="badge" id="badgeFab">0</span></button>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="bg" data-close></div>
  <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
    <div class="panel-head"><h2 id="cartTitle">Seu pedido</h2><button class="x" type="button" data-close aria-label="Fechar">×</button></div>
    <div class="scroll">
      <div class="items" id="items"></div>
      <form class="dados" id="dados" novalidate>
        <h3>Dados para o orçamento</h3>
        <label class="fld" id="f-nome">Razão social / Nome
          <input id="cliNome" type="text" autocomplete="organization" required>

          <input id="cliCnpj" type="text" inputmode="numeric" placeholder="00.000.000/0000-00" maxlength="18">

          <input id="cliPag" type="text" placeholder="Ex.: PIX, boleto 28 dias, cartão" required>
          <span class="msg"></span>
        </label>
        <div class="fld" id="f-ent">Entrega ou retirada
          <div class="seg" role="radiogroup">
            <label><input type="radio" name="ent" value="Entrega"> Entrega</label>
            <label><input type="radio" name="ent" value="Retira"> Retira</label>
          </div>
          <span class="msg"></span>
        </div>
      </form>
    </div>
    <div class="foot">
      <div class="tot"><span>Subtotal</span><b id="subtotal">R$ 0,00</b></div>
      <div class="note" id="scNote"></div>
      <button class="send" id="send" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 00-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1012 2zm5.6 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.2-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.6-.4.8-.4h.6c.2 0 .4 0 .7.5l.9 2.2c.1.2.1.4 0 .6l-.4.6-.3.3c-.1.1-.3.3-.1.6.1.3.6 1.1 1.4 1.8 1 .9 1.8 1.1 2 1.3.3.1.4.1.6-.1l.9-1c.2-.2.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.8-.1 1.5z"/></svg>
        Enviar orçamento pelo WhatsApp
      </button>
      <button class="clear" id="clear" type="button">Esvaziar carrinho</button>
    </div>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= CONFIGURAÇÃO ================= */
const CONFIG = {
  API_URL: '',                    // URL do App da Web do Apps Script (Implantar > App da Web) — termina em /exec
  PLANILHA_CSV: '',               // alternativa: link "Publicar na Web" em CSV da aba Catalogo
  DADOS_LOCAIS: 'produtos.json',  // usado enquanto as duas acima estiverem vazias
  WHATSAPP: '5511974880794',
  CACHE_MIN: 10,                  // minutos que o catálogo fica guardado no navegador
  POR_PAGINA: 48,
  CSV_TINY: false,                // inclui no WhatsApp o bloco CSV no modelo de importação de propostas do Tiny
};

/* ================= LEITURA DOS DADOS ================= */
const ALIAS = {
  codigo: ['codigo (sku)', 'codigo', 'sku'],
  nome:   ['descricao (catalogo)', 'descricao', 'nome'],
  cats:   ['tag(s) catalogo', 'catalogo(s)', 'catalogos', 'catalogo', 'tags', 'tag catalogo'],
  img:    ['imagem', 'url imagem 1', 'url imagem'],
  est:    ['estoque'],
  pA:     ['preco atacarejo', 'preco_atacarejo'],
  qA:     ['qtde atacarejo', 'qtde_atacarejo', 'qtde pcte'],
  pT:     ['preco atacado', 'preco_atacado'],
  qT:     ['qtde atacado', 'qtde_atacado', 'qtde cx'],
  nov:    ['novidade ate', 'novidade até', 'novidade'],
};
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase();
const num = v => {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).replace(/[^\d,.\-]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s); return isNaN(n) ? null : n;
};
const pos = v => { const n = num(v); return n && n > 0 ? n : null; };

// "Novidade até": data limite (dd/mm/aaaa, data da planilha) ou "Sim"
function ehNovidade(v) {
  if (v === null || v === undefined || v === '') return false;
  const s = String(v).trim();
  if (/^(sim|s|x|1|true)$/i.test(s)) return true;
  let d = null;
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; d = new Date(y, m[2] - 1, +m[1]); }
  else { const t = Date.parse(s); if (!isNaN(t)) d = new Date(t); }
  if (!d) return false;
  d.setHours(23, 59, 59, 999);
  return d >= new Date();
}

function mapear(item) {
  const k = {}; Object.keys(item).forEach(h => k[norm(h)] = item[h]);
  const get = campo => { for (const a of ALIAS[campo]) if (norm(a) in k) return k[norm(a)]; return undefined; };
  const cats = String(get('cats') ?? '').split(/[;\n]/).map(s => s.trim()).filter(Boolean).map(s => {
    const [c, ...g] = s.split('>'); return { cat: c.trim(), grp: g.join('>').trim() || 'Geral' };
  });
  return {
    cod: String(get('codigo') ?? '').trim(), nome: String(get('nome') ?? '').trim(),
    cats, img: String(get('img') ?? '').trim(), est: num(get('est')),
    pA: pos(get('pA')), qA: pos(get('qA')), pT: pos(get('pT')), qT: pos(get('qT')),
    nov: ehNovidade(get('nov')),
  };
}

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

function parseCSV(t) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}
const FONTE = CONFIG.API_URL || CONFIG.PLANILHA_CSV || '';
async function carregar() {
  const cache = store.get('luma_cat');
  if (cache && FONTE && cache.url === FONTE && Date.now() - cache.t < CONFIG.CACHE_MIN * 60000) return cache.d;
  let d;
  if (!CONFIG.API_URL && CONFIG.PLANILHA_CSV) {
    const r = await fetch(CONFIG.PLANILHA_CSV);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const [cab, ...linhas] = parseCSV(await r.text());
    d = { itens: linhas.filter(l => l.some(v => v.trim())).map(l => Object.fromEntries(cab.map((h, i) => [h, l[i] ?? '']))) };
  } else {
    const r = await fetch(CONFIG.API_URL || CONFIG.DADOS_LOCAIS, { redirect: 'follow' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d = await r.json();
  }
  if (FONTE) store.set('luma_cat', { url: FONTE, t: Date.now(), d });
  return d;
}

/* ================= PREÇO POR QUANTIDADE ================= */
// Abaixo do mínimo → sob consulta. ≥ qtde atacarejo → atacarejo. ≥ qtde atacado → atacado.
function preco(p, q) {
  if (p.pT && p.qT && q >= p.qT) return { faixa: 'Atacado', unit: p.pT };
  if (p.pA && q >= (p.qA || 1)) return { faixa: 'Atacarejo', unit: p.pA };
  if (!p.pA && p.pT && !p.qT) return { faixa: 'Atacado', unit: p.pT };
  const min = p.pA ? (p.qA || 1) : p.qT;
  return { faixa: 'Sob consulta', unit: null, min };
}
const esgotado = p => p.est !== null && p.est <= 0;
const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const qtdPadrao = p => p.qA || p.qT || 1;

/* ================= ESTADO ================= */
let P = [], CATS = [];
const st = { cat: null, grp: null, q: '', out: false, sort: 'nov', lim: CONFIG.POR_PAGINA };
let cart = store.get('luma_cart') || {};   // { cod: qtd }
const byCod = new Map();

/* ================= FILTROS ================= */
function tabs() {
  const box = document.getElementById('tabs'); box.textContent = '';
  const mk = (label, val) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tab';
    b.textContent = label; b.setAttribute('aria-pressed', st.cat === val);
    b.onclick = () => { st.cat = val; st.grp = null; st.lim = CONFIG.POR_PAGINA; tabs(); chips(); render(); };
    box.append(b);
  };
  mk('Todos', null);
  if (P.some(p => p.nov)) mk('Novidades', '__nov');
  CATS.forEach(c => mk(c, c));
}
function chips() {
  const box = document.getElementById('chips'); box.textContent = '';
  if (!st.cat || st.cat === '__nov') { box.hidden = true; return; }
  box.hidden = false;
  const cnt = new Map();
  P.forEach(p => p.cats.forEach(x => { if (x.cat === st.cat) cnt.set(x.grp, (cnt.get(x.grp) || 0) + 1); }));
  const mk = (label, val, n) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
    b.setAttribute('aria-pressed', st.grp === val);
    b.append(label); if (n != null) { const s = document.createElement('b'); s.textContent = n; b.append(s); }
    b.onclick = () => { st.grp = val; st.lim = CONFIG.POR_PAGINA; chips(); render(); };
    box.append(b);
  };
  mk('Todos', null, null);
  [...cnt.keys()].sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(g => mk(g, g, cnt.get(g)));
}
function filtrados() {
  const q = norm(st.q);
  let r = P.filter(p =>
    (!st.cat || (st.cat === '__nov' ? p.nov : p.cats.some(x => x.cat === st.cat && (!st.grp || x.grp === st.grp)))) &&
    (!q || norm(p.nome + ' ' + p.cod).includes(q)) &&
    (!st.out || !esgotado(p)));
  const ref = p => p.pA || p.pT || Infinity;
  if (st.sort === 'nov') r = r.slice().sort((a, b) => b.nov - a.nov);   // estável: mantém a ordem da planilha
  if (st.sort === 'nome') r = r.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  if (st.sort === 'asc') r = r.slice().sort((a, b) => ref(a) - ref(b));
  if (st.sort === 'desc') r = r.slice().sort((a, b) => (ref(b) === Infinity ? -1 : ref(b)) - (ref(a) === Infinity ? -1 : ref(a)));
  return r;
}

/* ================= GRADE ================= */
function iniciais(nome) { return nome.split(/\s+/).map(w => w.replace(/[^A-Za-zÀ-ú]/g, '')).filter(Boolean).slice(0, 2).map(w => w[0]).join(''); }
function thumb(p, cls) {
  const d = document.createElement('div'); d.className = cls;
  const ph = () => { const s = document.createElement('span'); s.className = 'ph'; s.textContent = iniciais(p.nome); return s; };
  if (p.img) {
    const i = document.createElement('img'); i.loading = 'lazy'; i.decoding = 'async'; i.alt = p.nome; i.src = p.img;
    i.onerror = () => { i.remove(); d.prepend(ph()); };
    d.append(i);
  } else d.append(ph());
  return d;
}
function card(p) {
  const c = document.createElement('article'); c.className = 'card' + (esgotado(p) ? ' out' : '');
  const t = thumb(p, 'thumb');
  if (esgotado(p)) { const f = document.createElement('span'); f.className = 'flag o'; f.textContent = 'Esgotado'; t.append(f); }
  else if (p.nov) { const f = document.createElement('span'); f.className = 'flag'; f.textContent = 'Novidade'; t.append(f); }
  const b = document.createElement('div'); b.className = 'body';
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = p.nome;
  const cd = document.createElement('div'); cd.className = 'cod'; cd.textContent = 'CÓD. ' + p.cod;
  const tiers = document.createElement('div'); tiers.className = 'tiers';
  const row = (cls, label, v) => { const r = document.createElement('div'); r.className = cls; const s = document.createElement('span'); s.textContent = label; const x = document.createElement('b'); x.textContent = v; r.append(s, x); tiers.append(r); };
  if (p.pA) row('t1', 'Atacarejo' + (p.qA ? ' · a partir de ' + p.qA + ' un' : ''), brl(p.pA));
  if (p.pT) row('t2', 'Atacado' + (p.qT ? ' · a partir de ' + p.qT + ' un' : ''), brl(p.pT));
  if (!p.pA && !p.pT) { const s = document.createElement('div'); s.className = 'sc'; s.textContent = 'Preço sob consulta'; tiers.append(s); }
  const add = document.createElement('div'); add.className = 'add';
  const inp = document.createElement('input'); inp.type = 'number'; inp.min = 1; inp.step = 1; inp.inputMode = 'numeric';
  inp.value = cart[p.cod] || qtdPadrao(p); inp.setAttribute('aria-label', 'Quantidade em unidades');
  const btn = document.createElement('button'); btn.type = 'button';
  btn.textContent = esgotado(p) ? 'Esgotado' : (cart[p.cod] ? 'Atualizar' : 'Adicionar'); btn.disabled = esgotado(p);
  const hint = document.createElement('div'); hint.className = 'hint';
  const upd = () => {
    const q = Math.max(1, Math.floor(num(inp.value) || 0));
    const pr = preco(p, q);
    hint.className = 'hint' + (pr.unit ? '' : ' sc');
    hint.textContent = pr.unit ? pr.faixa + ': ' + brl(pr.unit) + '/un · total ' + brl(pr.unit * q)
                               : 'Sob consulta' + (pr.min ? ' (mín. ' + pr.min + ' un)' : '');
  };
  inp.oninput = upd; upd();
  btn.onclick = () => {
    const q = Math.floor(num(inp.value) || 0);
    if (q < 1) { inp.focus(); return; }
    cart[p.cod] = q; salvar(); btn.textContent = 'Atualizar'; toast('Adicionado: ' + q + ' un');
  };
  add.append(inp, btn);
  b.append(nm, cd, tiers, add, hint);
  c.append(t, b);
  return c;
}
function render() {
  const out = document.getElementById('out');
  const r = filtrados();
  document.getElementById('count').innerHTML = '<strong>' + r.length.toLocaleString('pt-BR') + '</strong> produtos';
  if (!r.length) { out.innerHTML = '<p class="state">Nenhum produto encontrado.</p>'; document.getElementById('more').hidden = true; return; }
  const g = document.createElement('div'); g.className = 'grid';
  r.slice(0, st.lim).forEach(p => g.append(card(p)));
  out.replaceChildren(g);
  document.getElementById('more').hidden = r.length <= st.lim;
}

/* ================= CARRINHO ================= */
function itensCarrinho() { return Object.entries(cart).map(([cod, q]) => ({ p: byCod.get(cod), q })).filter(x => x.p); }
function totais() {
  let sub = 0, sc = 0;
  itensCarrinho().forEach(({ p, q }) => { const pr = preco(p, q); if (pr.unit) sub += pr.unit * q; else sc++; });
  return { sub, sc, n: itensCarrinho().length };
}
function salvar() { store.set('luma_cart', cart); badge(); if (document.getElementById('drawer').classList.contains('open')) desenharCarrinho(); }
function badge() {
  const t = totais();
  document.getElementById('badgeTop').textContent = t.n;
  document.getElementById('badgeFab').textContent = t.n;
  document.getElementById('totTop').textContent = brl(t.sub);
  document.getElementById('fab').classList.toggle('show', t.n > 0);
}
function desenharCarrinho() {
  const box = document.getElementById('items'); box.textContent = '';
  const its = itensCarrinho();
  if (!its.length) box.innerHTML = '<p class="state">Seu carrinho está vazio.</p>';
  its.forEach(({ p, q }) => {
    const pr = preco(p, q);
    const el = document.createElement('div'); el.className = 'item';
    const mini = document.createElement('div'); mini.className = 'mini'; if (p.img) mini.style.backgroundImage = 'url("' + p.img.replace(/"/g, '%22') + '")';
    const info = document.createElement('div');
    const n = document.createElement('div'); n.className = 'n'; n.textContent = p.nome;
    const c = document.createElement('div'); c.className = 'c'; c.textContent = 'CÓD. ' + p.cod;
    const pp = document.createElement('div'); pp.className = 'p' + (pr.unit ? '' : ' sc');
    if (pr.unit) { pp.append(pr.faixa + ' · ' + brl(pr.unit) + '/un = '); const bb = document.createElement('b'); bb.textContent = brl(pr.unit * q); pp.append(bb); }
    else pp.textContent = 'Preço sob consulta' + (pr.min ? ' (mín. ' + pr.min + ' un)' : '');
    info.append(n, c, pp);
    if (p.est !== null && p.est > 0 && q > p.est) { const w = document.createElement('div'); w.className = 'warn'; w.textContent = 'Quantidade acima do disponível — confirmaremos o prazo.'; info.append(w); }
    const qb = document.createElement('div'); qb.className = 'q';
    const inp = document.createElement('input'); inp.type = 'number'; inp.min = 1; inp.value = q; inp.inputMode = 'numeric'; inp.setAttribute('aria-label', 'Quantidade');
    inp.onchange = () => { const v = Math.floor(num(inp.value) || 0); if (v < 1) delete cart[p.cod]; else cart[p.cod] = v; salvar(); render(); };
    const rm = document.createElement('button'); rm.className = 'rm'; rm.type = 'button'; rm.textContent = 'Remover';
    rm.onclick = () => { delete cart[p.cod]; salvar(); render(); };
    qb.append(inp, rm);
    el.append(mini, info, qb); box.append(el);
  });
  const t = totais();
  document.getElementById('subtotal').textContent = brl(t.sub);
  document.getElementById('scNote').textContent = t.sc ? t.sc + (t.sc > 1 ? ' itens' : ' item') + ' com preço sob consulta (não somados ao subtotal).' : '';
  document.getElementById('send').disabled = !its.length;
}
function abrirCarrinho() { desenharCarrinho(); const d = document.getElementById('drawer'); d.classList.add('open'); d.setAttribute('aria-hidden', 'false'); }
function fecharCarrinho() { const d = document.getElementById('drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); }

/* ================= DADOS DO CLIENTE ================= */
const soDig = s => String(s).replace(/\D/g, '');
function mascaraCnpj(v) {
  const d = soDig(v).slice(0, 14);
  return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
          .replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
}
function cnpjValido(v) {
  const c = soDig(v);
  if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
  const dv = n => { let s = 0, p = n - 7; for (let i = 0; i < n; i++) { s += +c[i] * p--; if (p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return dv(12) === +c[12] && dv(13) === +c[13];
}
const cli = () => ({
  nome: document.getElementById('cliNome').value.trim(),
  cnpj: mascaraCnpj(document.getElementById('cliCnpj').value),
  pag: document.getElementById('cliPag').value.trim(),
  ent: (document.querySelector('input[name=ent]:checked') || {}).value || '',
});
function validar() {
  const c = cli(); let ok = true;
  const marca = (id, erro) => { const f = document.getElementById(id); f.classList.toggle('err', !!erro); f.querySelector('.msg').textContent = erro || ''; if (erro) ok = false; };
  marca('f-nome', c.nome ? '' : 'Informe a razão social ou nome.');
  marca('f-cnpj', !soDig(c.cnpj) || cnpjValido(c.cnpj) ? '' : 'CNPJ inválido — confira ou deixe em branco.');
  marca('f-pag', c.pag ? '' : 'Informe a forma de pagamento.');
  marca('f-ent', c.ent ? '' : 'Escolha entrega ou retirada.');
  return ok;
}
function salvarCli() { store.set('luma_cli', cli()); }
function carregarCli() {
  const c = store.get('luma_cli'); if (!c) return;
  document.getElementById('cliNome').value = c.nome || '';
  document.getElementById('cliCnpj').value = c.cnpj || '';
  document.getElementById('cliPag').value = c.pag || '';
  const r = document.querySelector('input[name=ent][value="' + (c.ent || '') + '"]'); if (r) r.checked = true;
}

/* ================= MENSAGEM + CSV TINY ================= */
const COLS_TINY = ['ID','Número da proposta','Data','Data próximo contato','ID contato','Nome do contato','Aos cuidados de','Lista de Preço','Tipo de Pessoa','CPF/CNPJ','RG/IE','CEP','Município','UF','Endereço','Endereço Nro','Complemento','Bairro','Fone','Celular','E-mail','Desconto','Frete','Observações','Validade','Prazo de Entrega','Situação','Introdução','ID produto','Descrição','Quantidade','Valor unitário','Descrição complementar','Vendedor','Destinatário','CPF/CNPJ entrega','CEP entrega','Município entrega','UF entrega','Endereço entrega','Endereço Nro entrega','Complemento entrega','Bairro entrega','Fone entrega','Inscrição Estadual entrega'];
const csvCel = v => { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const dec = v => v == null ? '' : v.toFixed(2).replace('.', ',');
const hoje = () => new Date().toLocaleDateString('pt-BR');

function csvTiny(c, its) {
  const obs = 'Catálogo online | Pagamento: ' + c.pag + ' | ' + c.ent;
  const linhas = its.map(({ p, q }, i) => {
    const pr = preco(p, q);
    const r = Object.fromEntries(COLS_TINY.map(k => [k, '']));
    r['Nome do contato'] = c.nome;
    if (i === 0) Object.assign(r, { 'Data': hoje(), 'Tipo de Pessoa': c.cnpj ? 'J' : '', 'CPF/CNPJ': c.cnpj, 'Observações': obs, 'Situação': 'Em aberto' });
    Object.assign(r, {
      'ID produto': p.cod, 'Descrição': p.nome, 'Quantidade': q,
      'Valor unitário': pr.unit ? dec(pr.unit) : '',
      'Descrição complementar': pr.unit ? pr.faixa : 'Preço sob consulta',
    });
    return COLS_TINY.map(k => csvCel(r[k])).join(',');
  });
  return [COLS_TINY.map(csvCel).join(','), ...linhas].join('\n');
}

function mensagem() {
  const c = cli(), its = itensCarrinho(), t = totais();
  const linhas = its.map(({ p, q }, i) => {
    const pr = preco(p, q);
    return (i + 1) + '. ' + [p.cod, p.nome, q, pr.faixa, pr.unit ? dec(pr.unit) : '-', pr.unit ? dec(pr.unit * q) : '-'].join(' | ');
  });
  let m = '*Orçamento – Catálogo Luma Festas*\n\n' +
    'Cliente: ' + c.nome + '\nCNPJ: ' + (c.cnpj || 'não informado') + '\nPagamento: ' + c.pag + '\nEntrega/Retira: ' + c.ent + '\n\n' +
    'Nº. Código | Descrição | Qtd | Tabela | Unit. R$ | Total R$\n' + linhas.join('\n') + '\n\nSubtotal: ' + brl(t.sub) + (t.sc ? '\nItens sob consulta: ' + t.sc : '');
  if (CONFIG.CSV_TINY) m += '\n\n--- CSV TINY (proposta) ---\n' + csvTiny(c, its) + '\n--- FIM CSV ---';
  return m;
}

/* ================= UI GERAL ================= */
let tt;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1600); }

{ const lg = document.getElementById('logo');
  const falha = () => { const s = document.createElement('span'); s.className = 'fallback'; s.textContent = 'LUMA FESTAS'; lg.replaceWith(s); };
  if (lg.complete && !lg.naturalWidth) falha(); else lg.onerror = falha; }
document.getElementById('cartTop').onclick = abrirCarrinho;
document.getElementById('fab').onclick = abrirCarrinho;
document.querySelectorAll('[data-close]').forEach(e => e.onclick = fecharCarrinho);
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharCarrinho(); });
document.getElementById('clear').onclick = () => { if (confirm('Esvaziar o carrinho?')) { cart = {}; salvar(); render(); } };
document.getElementById('cliCnpj').addEventListener('input', e => { e.target.value = mascaraCnpj(e.target.value); });
document.getElementById('dados').addEventListener('change', salvarCli);
['input', 'change'].forEach(ev => document.getElementById('dados').addEventListener(ev, () => { if (document.querySelector('.fld.err')) validar(); }));
document.getElementById('dados').addEventListener('submit', e => e.preventDefault());
document.getElementById('send').onclick = () => {
  if (!validar()) { document.querySelector('.fld.err input')?.focus(); toast('Preencha os dados do orçamento'); return; }
  salvarCli();
  window.open('https://wa.me/' + CONFIG.WHATSAPP + '?text=' + encodeURIComponent(mensagem()), '_blank', 'noopener');
};
let qt;
document.getElementById('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { st.q = e.target.value; st.lim = CONFIG.POR_PAGINA; render(); }, 150); });
document.getElementById('hideOut').onchange = e => { st.out = e.target.checked; st.lim = CONFIG.POR_PAGINA; render(); };
document.getElementById('sort').onchange = e => { st.sort = e.target.value; render(); };
document.getElementById('moreBtn').onclick = () => { st.lim += CONFIG.POR_PAGINA; render(); };
carregarCli();

/* ================= INÍCIO ================= */
carregar().then(d => {
  const itens = Array.isArray(d) ? d : (d.itens || []);
  P = itens.map(mapear).filter(p => {            // ignora sem código/catálogo e SKU repetido
    if (!p.cod || !p.nome || !p.cats.length || byCod.has(p.cod)) return false;
    byCod.set(p.cod, p); return true;
  });
  CATS = [...new Set(P.flatMap(p => p.cats.map(x => x.cat)))];
  document.getElementById('upd').textContent = !FONTE ? 'Dados de demonstração' : (d.atualizado ? 'Estoque/preços atualizados em ' + d.atualizado : '');
  tabs(); chips(); render(); badge();
}).catch(err => {
  document.getElementById('out').innerHTML = '<p class="state">Não foi possível carregar o catálogo. Tente novamente em instantes.</p>';
  console.error(err);
});
</script>
